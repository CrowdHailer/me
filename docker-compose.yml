services:
  build:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace/me
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - .:/workspace/me
      - ../pamphlet:/workspace/pamphlet:ro
      - gleam-build:/workspace/me/build
    command: >-
      sh -ec 'build_site() { set +e; gleam dev build; status=$$?; chown -R "$$HOST_UID:$$HOST_GID" _site; set -e; return $$status; };
      build_site;
      while inotifywait -q -r -e close_write,create,delete,move
      --exclude "(^|/)(.git|.jekyll-cache|_site|build|personal)(/|$)"
      . /workspace/pamphlet/src;
      do build_site; done;
      exit 1'

  caddy:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - ./_site:/srv:ro

  live-reload:
    image: node:22-alpine@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2
    depends_on:
      - caddy
    ports:
      - "3000:3000"
    volumes:
      - ./_site:/site:ro
    command: >-
      npx --yes browser-sync@3.0.4 start
      --proxy http://caddy:80
      --files /site/**/*
      --host 0.0.0.0
      --port 3000
      --no-open
      --no-ui
      --no-ghost-mode

volumes:
  gleam-build:
