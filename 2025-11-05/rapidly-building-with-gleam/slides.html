## Convention over configuration

```rs
pub fn handle(request, context) {
  let Request(method:, ..) = request
  case request.path_segments(request), method {
    [], http.Get -> wisp.redirect("/engine/flows")
    ["flows", ..rest], _ -> case rest, method {
      [], http.Get -> flows.index(context)
      ["new"], http.Get -> flows.new(context)
      [], http.Post -> flows.create(request, context)
      [id], http.Get -> flows.show(id, context)
      [id, "edit"], http.Get -> flows.edit(id, context)
      [id], http.Post -> flows.update(id, request, context)
      [id], http.Delete -> flows.delete(id, context)
      _, _ -> wisp.not_found()
    }
    _, _ -> wisp.not_found()
  }
}

```
