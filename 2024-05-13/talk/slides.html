class: middle 

### Gleam **transpiles**

```rs
pub fn sum(items) {
  list.fold(items, 0, fn(a, b) { a + b })
}
```

... to erlang

```erlang
-spec sum(list(integer())) -> integer().
sum(Items) ->
    gleam@list:fold(Items, 0, fun(A, B) -> A + B end).
```

... to JavaScript

```js
function sum(items) {
  return $list.fold(items, 0, (a, b) => { return a + b; });
}
```

### Error detection

Gleam has **assertions**,

```rs
let assert Ok(value) = result
```

and **panic**.

```rs
pub fn main(result) {
  case result {
    Ok(value) -> "ok"
    _ -> panic as "should be ok"
  }
}
```

If your program compiles it might crash.

And the best way to deal with it is a supervision tree.

And this is before FFI

## Gleam is **Multilingual**

>  Gleam makes it easy to use code written in other BEAM languages such as Erlang and Elixir, so there's a rich ecosystem of thousands of open source libraries for Gleam users to make use of.
> 
> Gleam can additionally compile to JavaScript, enabling you to use your code in the browser, or anywhere else JavaScript can run. It also generates TypeScript definitions, so you can interact with your Gleam code confidently, even from the outside.

### `use` syntax primer

```rs
fn foo() {
  result.try(httpc.send(req), fn(resp) {
    Ok(resp.body)
  })
}
```
```rs
fn foo() {
  use resp <- result.try(httpc.send(req))
  Ok(resp.body)
}
```
```rs
// result.gleam
pub fn try(result, fun) {
  case result {
    Ok(x) -> fun(x)
    Error(e) -> Error(e)
  }
}
```

### Making an **http** request

```rs
import gleam/httpc
import gleam/http/request
import gleam/http/response
import gleam/result

pub fn main() {
  let assert Ok(req) = request.to("https://example.com")

  use resp <- result.try(httpc.send(req))

  Ok(resp.body)
}
```

---

class: middle

### Also making an **http** request

```rs
import gleam/fetch
import gleam/http/request
import gleam/http/response
import gleam/javascript/promise

pub fn main() {
  let assert Ok(req) = request.to("https://example.com")

  use resp <- promise.try_await(fetch.send(req))
  use resp <- promise.try_await(fetch.read_text_body(resp))

  promise.resolve(Ok(resp.body))
}
```
